[pytest]
minversion = 7.0
addopts = 
    -ra 
    -q 
    --cov=azure_pricing_server 
    --cov-report=term-missing 
    --cov-report=html
    --strict-markers
testpaths = tests
asyncio_mode = auto
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    integration: marks tests as integration tests (requires internet)
    slow: marks tests as slow running
